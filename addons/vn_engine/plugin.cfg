[plugin]
name="VN Engine"
description="Visual novel engine for Godot 4.4. Write your story in plain text scenario files and set up the game with .tres resources. Characters with side images, backgrounds with zoom and pan, choices, branching chapters, flags, music and ambient sound with fades, save and load, rollback, backlog, auto and skip modes, CG gallery, multiple endings, a flowchart, variables and text tags in dialogue, an NVL mode, and credits."
author="Kaan Akgündoğdu"
version="0.18.0"
script="plugin.gd"
