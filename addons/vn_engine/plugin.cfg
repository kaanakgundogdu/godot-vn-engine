[plugin]
name="VN Engine"
description="Visual novel engine for Godot 4.4. Write your story in plain text scenario files and set up the game with .tres resources. Characters, backgrounds, choices, branching chapters, flags, save and load, rollback, backlog, auto and skip modes, CG gallery, multiple endings and credits."
author="Kaan Akgündoğdu"
version="0.9.0"
script="plugin.gd"
