[plugin]
name="VN Engine"
description="Visual novel engine for Godot 4.4. Write your story in plain text scenario files and set up the game with .tres resources. Characters with side images, backgrounds with zoom and pan, choices, branching chapters, flags with math and random numbers, music and ambient sound with fades, rain, snow and fog weather effects, text blips while dialogue types out, screen and menu transitions with a reduce motion setting, save and load, rollback, backlog, auto and skip modes, skip to the next choice, locked choices with hints, a story completion percent, a text size setting, CG gallery, multiple endings, a flowchart, variables and text tags in dialogue, an NVL mode, and credits."
author="Kaan Akgündoğdu"
version="0.22.0"
script="plugin.gd"
